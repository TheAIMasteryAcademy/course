name: Check links

on:
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail './**/*.md'
          fail: true
